services:
  bugler:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - bugler-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bugler-data:
