name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core, Workers, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:core
      - name: Daemon MCP conformance
        run: bun run test:daemon-mcp
      - run: bun run test:workers
      - run: bash scripts/smoke.sh

  emulators:
    name: Docker storage emulators
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'emulators'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test:dynamodb
      - run: bun run test:cosmos
